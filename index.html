<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMARRE prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2540;--navy2:#123A5C;--teal:#0E7490;--teal-l:#DDF0F3;--orange:#E85D04;--orange-l:#FFE3D0;
  --yellow:#FFC145;--yellow-l:#FFF4DC;--green:#1E9E62;--green-l:#DDF5E8;--red:#C93A3A;--red-l:#FBE3E3;
  --bg:#EEF5F8;--card:#FFFFFF;--text:#0A2540;--muted:#587085;--line:#D3DEE6;--r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;line-height:1.2}
p{margin:0}
button,select{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:#fff}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:.6px}
.tagline{color:#9FB7C9;font-size:13px}
.demo-pill{margin-left:auto;background:var(--navy2);color:var(--yellow);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.stepper{display:flex;gap:6px;list-style:none;margin:18px 0 0;padding:0;overflow-x:auto}
.stepper li{flex:1 1 0;min-width:96px}
.stepper button{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;border-top:3px solid var(--line);padding:8px 2px 4px;color:var(--muted);font-size:13px;font-weight:600;text-align:left}
.stepper .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--navy);font-size:12px;font-weight:700}
.stepper li.done button{border-top-color:var(--teal);color:var(--teal)}
.stepper li.done .n{background:var(--teal);color:#fff}
.stepper li.cur button{border-top-color:var(--orange);color:var(--navy)}
.stepper li.cur .n{background:var(--orange);color:#fff}
.stepper button:disabled{cursor:not-allowed;opacity:.55}
main{padding:20px 0 48px}
.head{margin-bottom:18px}
.head h1{font-size:28px}
.head p{color:var(--muted);margin-top:6px;max-width:760px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.cards{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.card.dark .muted{color:#9FB7C9}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-teal{background:var(--teal-l);color:var(--teal)}
.b-green{background:var(--green-l);color:var(--green)}
.b-orange{background:var(--orange-l);color:#A8430A}
.b-yellow{background:var(--yellow-l);color:#8A5A00}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:11px 20px;font-weight:600;background:var(--orange);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--teal-l);color:var(--teal)}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.note{border-radius:12px;padding:12px 14px;font-size:14px}
.note.teal{background:var(--teal-l)}.note.yellow{background:var(--yellow-l)}.note.green{background:var(--green-l)}.note.red{background:var(--red-l)}
.kpi{font-family:'Space Grotesk';font-size:26px;font-weight:700}
label.f,.f{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input[type=text],select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--text);background:#fff}
input[type=range]{width:100%;accent-color:var(--orange)}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px}
.field{margin-bottom:16px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* objects */
.obj{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}
.ico{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--teal-l);color:var(--teal);overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.obj h3{font-size:16px}
.obj .acts{display:flex;gap:6px;align-items:center}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{background:var(--bg)}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}

/* AI */
.typing{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--teal);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.reveal{animation:r .35s ease both}
@keyframes r{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal,.dots span{animation:none}}
.plan h3{font-size:15px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.plan ul{margin:0 0 14px;padding-left:20px}
.plan li{margin:3px 0}
.kid{background:var(--yellow-l);border-radius:12px;padding:12px 14px}
.kid ol{margin:8px 0 0;padding-left:20px}
.eq{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.eq:last-child{border-bottom:0}
.eq label{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.eq input{width:18px;height:18px;accent-color:var(--teal)}

/* listings */
.lst{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;color:#fff;background:var(--teal)}
.lst h3{font-size:16px}
.price{font-family:'Space Grotesk';font-size:20px;font-weight:700;text-align:right}
.lst.sel{outline:2.5px solid var(--orange)}
.ai-txt{font-style:italic;color:var(--text);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:14px}
.group{margin-bottom:18px}
.group>h2{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px}

/* inspection */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{border-color:var(--teal);background:var(--teal);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.ins{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ins:last-child{border-bottom:0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on.ok{background:var(--green-l);color:var(--green)}
.seg button.on.rayure{background:var(--yellow-l);color:#8A5A00}
.seg button.on.choc{background:var(--red-l);color:var(--red)}
.seg button:disabled{cursor:not-allowed}
.lines{display:grid;gap:10px}
.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.line:last-child{border-bottom:0;padding-bottom:0}
.total{font-family:'Space Grotesk';font-size:22px;font-weight:700}
footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 28px}
@media (max-width:820px){
  .grid2{grid-template-columns:1fr}
  .head h1{font-size:24px}
  .stepper .lbl{display:none}
  .stepper li{min-width:44px}
  .lst{grid-template-columns:44px 1fr}
  .lst .side{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
  .ins{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#123A5C" stroke="#FFC145" stroke-width="3"/><rect x="15" y="8" width="2" height="17" fill="#D7E3EC"/><path d="M17.5 9 L29 8 L27.5 22 L17.5 23 Z" fill="#FFC145"/><path d="M9 25 H31 L28 31 H12 Z" fill="#fff"/></svg>
        AMARRE
      </div>
      <span class="tagline">Déménager entre particuliers, en protégeant ce qui compte.</span>
      <span class="demo-pill">Démo · données fictives</span>
    </div>
  </div>
</header>
<div class="wrap">
  <ol class="stepper" id="stepper" aria-label="Étapes"></ol>
  <main id="main"></main>
</div>
<footer>Prototype AMARRE · équipe CodeBreakers · Particuliers, annonces et prix fictifs. L’IA est simulée dans cette démo ; aucun paiement réel.</footer>

<script>
(function () {
  'use strict';

  /* ---------- données fictives ---------- */
  const MOVE = { from: 'Brest', to: 'Annecy', date: 'samedi 4 juillet', km: 1000 };
  const PACK = 19, COMMISSION = 0.10, RESALE = 0.8;
  const EQ = {
    remorque: 'Remorque à bateau', sangles: 'Sangles à cliquet', mousses: 'Mousses de protection', housse_voile: 'Housse de voile',
    couvertures: 'Couvertures de déménagement', film: 'Film étirable', cartons: 'Cartons renforcés', bulle: 'Papier bulle',
    housse_velo: 'Housse de vélo', housse_tv: 'Housse matelassée de télévision', housse_matelas: 'Housse de matelas',
    diable: 'Diable de manutention', housse_planche: 'Housse de planche'
  };
  const CATS = {
    bateau: { label: 'Bateau (Optimist)', eq: { remorque: 1, sangles: 2, mousses: 4, housse_voile: 1 },
      plan: ['Mât, bôme et livarde dans la mousse, attachés le long de la remorque.', 'Coque centrée sur la remorque, deux sangles croisées, serrées sans excès.', 'Safran et dérive dans leurs housses, rangés dans la voiture.', 'Voile roulée, jamais pliée, dans sa housse.'] },
    canape: { label: 'Canapé', eq: { couvertures: 2, film: 1, sangles: 2 },
      plan: ['Coussins retirés et emballés à part.', 'Canapé enveloppé dans 2 couvertures, puis dans le film étirable.', 'Calé debout contre la paroi du camion, avec 2 sangles.'] },
    velo: { label: 'Vélo', eq: { housse_velo: 1, mousses: 2 },
      plan: ['Pédales et guidon tournés vers l’intérieur.', 'Mousses sur le cadre, vélo dans sa housse.', 'Chargé en dernier, contre un meuble lourd.'] },
    vaisselle: { label: 'Vaisselle', eq: { cartons: 6, bulle: 1 },
      plan: ['Assiettes rangées sur la tranche, jamais à plat.', 'Chaque verre dans le papier bulle.', 'Cartons marqués « fragile », chargés en haut.'] },
    tv: { label: 'Télévision', eq: { housse_tv: 1, couvertures: 1 },
      plan: ['Écran dans sa housse matelassée, jamais posé à plat.', 'Transportée debout, calée dans une couverture.'] },
    lit: { label: 'Lit et matelas', eq: { housse_matelas: 1, sangles: 2 },
      plan: ['Lit démonté, vis dans un sachet scotché au montant.', 'Matelas dans sa housse, debout contre la paroi.'] },
    armoire: { label: 'Armoire', eq: { couvertures: 3, sangles: 2, diable: 1 },
      plan: ['Armoire vidée, portes maintenues fermées par le film.', 'Déplacée au diable, protégée par 3 couvertures.', 'Sanglée contre la paroi du camion.'] },
    planche: { label: 'Planche à voile', eq: { housse_planche: 1, mousses: 2, sangles: 2 },
      plan: ['Aileron démonté, planche dans sa housse.', 'Mousses aux points d’appui, 2 sangles.'] }
  };
  const ICONS = {
    bateau: '<path d="M6 30h28l-4 6H10z" fill="currentColor"/><path d="M19 6v22" stroke="currentColor" stroke-width="2"/><path d="M21 7l10-1-2 15-8 1z" fill="currentColor" opacity=".6"/>',
    canape: '<rect x="5" y="16" width="30" height="12" rx="3" fill="currentColor"/><rect x="9" y="11" width="22" height="8" rx="2" fill="currentColor" opacity=".6"/><path d="M8 28v4M32 28v4" stroke="currentColor" stroke-width="2"/>',
    velo: '<circle cx="11" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="29" cy="26" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M11 26l7-10h8l3 10M18 16l-3-4h-3" fill="none" stroke="currentColor" stroke-width="2.5"/>',
    vaisselle: '<ellipse cx="20" cy="24" rx="14" ry="5" fill="currentColor" opacity=".6"/><ellipse cx="20" cy="20" rx="14" ry="5" fill="currentColor"/>',
    tv: '<rect x="5" y="9" width="30" height="19" rx="2" fill="currentColor"/><path d="M14 33h12M20 28v5" stroke="currentColor" stroke-width="2.5"/>',
    lit: '<rect x="5" y="18" width="30" height="9" rx="2" fill="currentColor"/><rect x="7" y="13" width="9" height="6" rx="2" fill="currentColor" opacity=".6"/><path d="M6 27v5M34 27v5" stroke="currentColor" stroke-width="2.5"/>',
    armoire: '<rect x="9" y="5" width="22" height="30" rx="2" fill="currentColor"/><path d="M20 7v26" stroke="#fff" stroke-width="1.5"/><circle cx="17" cy="20" r="1.3" fill="#fff"/><circle cx="23" cy="20" r="1.3" fill="#fff"/>',
    planche: '<path d="M8 32C14 20 24 10 33 7c-2 9-11 19-23 26z" fill="currentColor"/>'
  };
  const LISTINGS = {
    remorque: [
      { who: 'Marc', ini: 'M', km: 4, price: 180, txt: 'Remorque pour Optimist, roues et éclairage en bon état. Mon fils est passé au Laser : elle ne sert plus.' },
      { who: 'Sandrine', ini: 'S', km: 8, price: 220, txt: 'Remorque légère pour dériveur, révisée ce printemps, avec support de mât.' }
    ],
    sangles: [{ who: 'Inès', ini: 'I', km: 2, price: 15, txt: 'Lot de 6 sangles à cliquet, utilisées une seule fois pour un déménagement.' }],
    mousses: [{ who: 'Club de voile de Brest', ini: 'CV', km: 2, price: 0, txt: 'Mousses de protection données par le club aux familles de navigateurs qui déménagent.', club: true }],
    housse_voile: [{ who: 'Hugo', ini: 'H', km: 6, price: 10, txt: 'Housse de voile d’Optimist, fermeture éclair neuve.' }],
    couvertures: [{ who: 'Paul', ini: 'P', km: 6, price: 20, txt: 'Lot de 10 couvertures de déménagement épaisses, propres.' }],
    film: [{ who: 'Lucie', ini: 'L', km: 3, price: 5, txt: 'Rouleau de film étirable entamé, il en reste les trois quarts.' }],
    cartons: [{ who: 'Sophie', ini: 'S', km: 1, price: 0, txt: '30 cartons renforcés, déjà servis pour notre propre déménagement : je les donne.' }],
    bulle: [{ who: 'Sophie', ini: 'S', km: 1, price: 3, txt: 'Rouleau de papier bulle, presque plein.' }],
    housse_velo: [{ who: 'Karim', ini: 'K', km: 7, price: 8, txt: 'Housse de vélo rembourrée, taille enfant et adulte.' }],
    housse_tv: [{ who: 'Nadia', ini: 'N', km: 3, price: 12, txt: 'Housse matelassée pour écran jusqu’à 65 pouces.' }],
    housse_matelas: [{ who: 'Nadia', ini: 'N', km: 3, price: 6, txt: 'Housse de matelas 140 × 190, plastique épais.' }],
    diable: [{ who: 'Thomas', ini: 'T', km: 9, price: 25, txt: 'Diable de manutention, roues gonflables, charge 200 kg.' }],
    housse_planche: [{ who: 'Hugo', ini: 'H', km: 6, price: 12, txt: 'Housse de planche à voile, rembourrée.' }]
  };
  const COLORS = ['#0E7490', '#E85D04', '#1E9E62', '#7A4FB3', '#B7791F'];
  const STEPS = ['Mes objets', 'L’IA prépare', 'S’équiper', 'État des lieux', 'Récap et revente'];
  const ST = { ok: 'OK', rayure: 'Rayure', choc: 'Choc' }, RANK = { ok: 0, rayure: 1, choc: 2 };

  /* ---------- état ---------- */
  const KEY = 'amarre-demo-v2';
  const DEFAULT_OBJECTS = [
    { id: 'o1', name: 'Optimist de Léo', cat: 'bateau', kid: true }, { id: 'o2', name: 'Canapé 3 places', cat: 'canape' },
    { id: 'o3', name: 'Vélo de Léo', cat: 'velo', kid: true }, { id: 'o4', name: 'Vaisselle', cat: 'vaisselle' }, { id: 'o5', name: 'Télévision', cat: 'tv' }
  ];
  const fresh = () => ({ step: 1, objects: DEFAULT_OBJECTS.map(o => Object.assign({}, o)), seq: 6, analyzed: false, have: {}, picks: {}, equipDone: false, child: 'Léo', age: 12, before: {}, after: {}, beforeAt: null, afterAt: null, phase: 'before', resale: false, confirmed: false });
  let S = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { /* stockage indisponible */ }
  const photos = {};
  let animating = false;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } };
  const $ = s => document.querySelector(s);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = n => (Math.round(n * 100) / 100).toLocaleString('fr-FR', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + ' €';
  const hm = ts => { const d = new Date(ts); return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0'); };
  const arr = () => (new Date(S.afterAt).toDateString() === new Date(S.beforeAt).toDateString() ? 'à ' : 'le lendemain à ') + hm(S.afterAt);
  const kidName = () => (S.child || '').trim() || 'ton enfant';
  const icon = (cat, size) => '<svg width="' + (size || 30) + '" height="' + (size || 30) + '" viewBox="0 0 40 40" aria-hidden="true">' + (ICONS[cat] || '') + '</svg>';

  function needs() {
    const n = {};
    S.objects.forEach(o => Object.entries(CATS[o.cat].eq).forEach(([k, q]) => { n[k] = (n[k] || 0) + q; }));
    return n;
  }
  const missing = () => Object.keys(needs()).filter(k => !S.have[k]);
  function picked() {
    return missing().filter(k => S.picks[k] != null && LISTINGS[k]).map(k => Object.assign({ key: k }, LISTINGS[k][S.picks[k]]));
  }
  const maxStep = () => !S.analyzed ? (S.objects.length ? 1 : 1) : !S.equipDone ? 3 : !(S.beforeAt && S.afterAt) ? 4 : 5;

  /* ---------- « IA » simulée ---------- */
  function kidMission() {
    const POSS = { bateau: 'ton Optimist', velo: 'ton vélo', planche: 'ta planche à voile' };
    const n = kidName(), young = S.age <= 11, items = S.objects.filter(o => o.kid && POSS[o.cat]).map(o => POSS[o.cat]);
    const what = items.length ? items.join(' et ') : 'tes affaires', whatDe = items.length ? items.join(' et de ') : 'tes affaires';
    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
    return young ? {
      intro: 'Capitaine ' + n + ' ! ' + cap(what) + (items.length === 1 ? ' déménage' : ' déménagent') + ' avec toi jusqu’à ' + MOVE.to + '. Ta mission :',
      steps: ['Entoure ton mât de mousses, comme un trésor.', 'Range ton safran et ta dérive dans leurs housses.', 'Tourne les pédales de ton vélo vers l’intérieur.'],
      end: 'Un adulte vérifiera. Bon vent, capitaine !'
    } : {
      intro: n + ', tu es responsable de ' + whatDe + ' pour ce déménagement de ' + MOVE.km.toLocaleString('fr-FR') + ' km. Ta check-list :',
      steps: ['Mât, bôme et livarde dans les mousses.', 'Safran et dérive en housse, voile roulée avec ses lattes.', 'Pédales et guidon tournés vers l’intérieur.', 'Une photo de chaque objet pour l’état des lieux.'],
      end: 'Tes affaires sont entre de bonnes mains : les tiennes.'
    };
  }
  function planHTML() {
    const n = needs();
    const objs = S.objects.map(o => '<div class="plan"><h3>' + icon(o.cat, 20) + esc(o.name) + '</h3><ul>' + CATS[o.cat].plan.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>').join('');
    const eq = Object.keys(n).map(k => '<div class="eq"><label><input type="checkbox" data-have="' + k + '"' + (S.have[k] ? ' checked' : '') + '> J’ai déjà</label><span style="flex:1">' + esc(EQ[k]) + '</span><strong>× ' + n[k] + '</strong></div>').join('');
    const m = kidMission();
    return '<div class="reveal">' + objs + '</div>' +
      '<div class="kid reveal"><strong>Mission de ' + esc(kidName()) + '</strong><p style="margin-top:4px">' + esc(m.intro) + '</p><ol>' + m.steps.map(t => '<li>' + esc(t) + '</li>').join('') + '</ol><p style="margin-top:8px;font-weight:600">' + esc(m.end) + '</p></div>' +
      '<div class="reveal" style="margin-top:16px"><h3 style="font-size:16px;margin-bottom:4px">L’équipement nécessaire</h3><p class="small muted" style="margin-bottom:6px">Coche ce que tu as déjà : AMARRE cherche le reste chez tes voisins.</p>' + eq + '</div>';
  }
  function resaleText(it) {
    return '« À vendre : ' + EQ[it.key].toLowerCase() + '. Utilisation : un seul déménagement (' + MOVE.from + ' → ' + MOVE.to + '). État : bon, vérifié à l’arrivée. Prix : ' + eur(Math.round(it.price * RESALE)) + '. »';
  }

  /* ---------- rendu ---------- */
  function renderStepper() {
    const m = maxStep();
    $('#stepper').innerHTML = STEPS.map((l, i) => {
      const n = i + 1, cls = n === S.step ? 'cur' : n < m ? 'done' : '';
      return '<li class="' + cls + '"><button type="button" data-go="' + n + '"' + (n > m ? ' disabled' : '') + ' aria-label="Étape ' + n + ' : ' + l + '"' + (n === S.step ? ' aria-current="step"' : '') + '><span class="n">' + n + '</span><span class="lbl">' + l + '</span></button></li>';
    }).join('');
  }
  function render() {
    if (S.step > maxStep()) S.step = maxStep();
    renderStepper();
    $('#main').innerHTML = [null, vObjects, vPrepare, vEquip, vInspect, vRecap][S.step]();
    if (S.step === 2 && S.analyzed && !animating) $('#ai-out').innerHTML = planHTML();
    save();
  }
  function go(n) { S.step = n; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  const reset = () => { S.analyzed = false; S.have = {}; S.picks = {}; S.equipDone = false; S.before = {}; S.after = {}; S.beforeAt = S.afterAt = null; S.phase = 'before'; S.resale = false; S.confirmed = false; };

  function vObjects() {
    const list = S.objects.map(o => '<div class="card obj"><div class="ico">' + (photos[o.id] ? '<img src="' + photos[o.id] + '" alt="Photo : ' + esc(o.name) + '">' : icon(o.cat)) + '</div>' +
      '<div><h3>' + esc(o.name) + '</h3><div class="small muted">' + esc(CATS[o.cat].label) + (o.kid ? ' · <span class="badge b-yellow">Trésor de ' + esc(kidName()) + '</span>' : '') + '</div></div>' +
      '<div class="acts"><span class="btn ghost sm file-btn">Photo<input type="file" accept="image/*" capture="environment" data-photo="' + o.id + '" aria-label="Photo : ' + esc(o.name) + '"></span><button class="x" type="button" data-del="' + o.id + '" aria-label="Retirer ' + esc(o.name) + '">×</button></div></div>').join('');
    const opts = Object.entries(CATS).map(([k, c]) => '<option value="' + k + '">' + c.label + '</option>').join('');
    return '<div class="head"><h1>Le déménagement de la famille de ' + esc(kidName()) + '</h1><p>' + MOVE.from + ' → ' + MOVE.to + ' · ' + MOVE.date + ' · ≈ ' + MOVE.km.toLocaleString('fr-FR') + ' km, entre particuliers : un camion loué et des amis. Prends tes objets en photo : l’IA s’occupe du reste.</p></div>' +
      '<div class="grid2"><div class="cards">' + (list || '<div class="card muted">Ajoute au moins un objet.</div>') +
      '<div class="card"><span class="f">Ajouter un objet</span><div class="add"><select id="new-cat" aria-label="Type d’objet">' + opts + '</select><button class="btn sec" type="button" id="add">Ajouter</button></div></div></div>' +
      '<div class="cards"><div class="card dark"><p class="small muted">Inventaire</p><div class="row" style="gap:22px;margin:6px 0 10px"><div><div class="kpi">' + S.objects.length + '</div><div class="small muted">objets</div></div><div><div class="kpi" style="color:#FFC145">' + Object.keys(needs()).length + '</div><div class="small muted">types d’équipement</div></div></div>' +
      '<p class="small muted">Les photos restent sur ton appareil (démo). Dans l’appli, l’IA reconnaît l’objet sur la photo.</p></div>' +
      '<button class="btn" type="button" id="analyze"' + (S.objects.length ? '' : ' disabled') + '>Lancer l’analyse de l’IA</button>' +
      '<div class="note teal"><strong>Protection de l’enfant.</strong> ' + esc(kidName()) + ' n’a pas de compte : il voit ses missions sur l’appli de ses parents, et ne parle à aucun inconnu.</div></div></div>';
  }

  function vPrepare() {
    return '<div class="head"><h1>L’IA prépare le déménagement</h1><p>Pour chaque objet, l’IA écrit le plan de protection et liste l’équipement nécessaire. Elle écrit aussi une mission pour ' + esc(kidName()) + ', adaptée à son âge.</p></div>' +
      '<div class="grid2"><div class="card"><div class="row between" style="margin-bottom:12px"><span class="badge b-yellow">Écrit par l’IA (simulée pour la démo)</span></div><div id="ai-out"></div></div>' +
      '<div class="cards"><div class="card"><div class="field"><label class="f" for="child">Prénom de l’enfant</label><input type="text" id="child" maxlength="20" value="' + esc(S.child) + '" autocomplete="off"></div>' +
      '<div class="field"><label class="f" for="age">Âge : <span id="age-v">' + S.age + ' ans</span></label><input type="range" id="age" min="8" max="16" value="' + S.age + '"><div class="row between small muted"><span>8 ans : mission ludique</span><span>16 ans : check-list</span></div></div>' +
      '<button class="btn ghost" type="button" id="rewrite">Réécrire la mission</button></div>' +
      '<button class="btn" type="button" data-go="3" id="to-equip"' + (animating ? ' disabled' : '') + '>Trouver l’équipement chez les voisins</button></div></div>';
  }

  function vEquip() {
    const miss = missing();
    const groups = miss.map(k => {
      const ls = LISTINGS[k] || [];
      return '<div class="group"><h2>' + esc(EQ[k]) + (S.picks[k] != null ? ' <span class="badge b-green">Trouvé ✓</span>' : '') + '</h2><div class="cards">' + ls.map((l, i) => {
        const sel = S.picks[k] === i;
        return '<div class="card lst' + (sel ? ' sel' : '') + '"><div class="av" style="background:' + COLORS[(l.who.length + i) % COLORS.length] + '" aria-hidden="true">' + l.ini + '</div>' +
          '<div><div class="row"><h3>' + esc(l.who) + '</h3><span class="badge b-teal">✓ Vérifié</span><span class="small muted">à ' + l.km + ' km</span></div>' +
          '<div class="ai-txt">' + esc(l.txt) + '</div><div class="small muted" style="margin-top:4px">Annonce rédigée par l’IA à partir des photos du vendeur</div></div>' +
          '<div class="side"><div class="price">' + (l.price ? eur(l.price) : 'Gratuit') + '</div><button class="btn sm' + (sel ? ' sec' : '') + '" type="button" data-pick="' + k + '" data-i="' + i + '" style="margin-top:8px">' + (sel ? 'Choisi ✓' : 'Je prends') + '</button></div></div>';
      }).join('') + '</div></div>';
    }).join('');
    const p = picked(), tot = p.reduce((a, x) => a + x.price, 0);
    return '<div class="head"><h1>S’équiper entre voisins</h1><p>Tout ce qui manque existe déjà chez un particulier près de chez toi. Achète d’occasion, et revends après le déménagement.</p></div>' +
      '<div class="grid2"><div>' + (groups || '<div class="card">Tu as déjà tout l’équipement nécessaire.</div>') + '</div>' +
      '<div class="cards" style="position:sticky;top:12px"><div class="card"><h3 style="font-size:17px;margin-bottom:10px">Ton panier</h3><div class="lines">' +
      (p.length ? p.map(x => '<div class="line"><span>' + esc(EQ[x.key]) + '<br><span class="small muted">' + esc(x.who) + ', à ' + x.km + ' km</span></span><strong>' + (x.price ? eur(x.price) : 'Gratuit') + '</strong></div>').join('') : '<p class="muted small">Choisis une annonce pour chaque équipement.</p>') +
      '<div class="line"><span class="total">Total</span><span class="total">' + eur(tot) + '</span></div></div>' +
      '<p class="small muted" style="margin-top:8px">Dont 10 % de commission AMARRE, payée par le vendeur. Le paiement est versé au vendeur une fois l’équipement remis.</p></div>' +
      '<button class="btn" type="button" id="equip-done">' + (p.length < miss.length ? 'Continuer (il me manque des choses)' : 'Passer à l’état des lieux') + '</button></div></div>';
  }

  function vInspect() {
    const ph = S.phase, st = S[ph], done = S.objects.every(o => st[o.id]), locked = ph === 'before' ? !!S.beforeAt : !!S.afterAt;
    const rows = S.objects.map(o => '<div class="ins"><div class="row">' + icon(o.cat, 22) + '<strong>' + esc(o.name) + '</strong></div><div class="seg" role="group" aria-label="État : ' + esc(o.name) + '">' +
      ['ok', 'rayure', 'choc'].map(s => '<button type="button" class="' + s + (st[o.id] === s ? ' on' : '') + '" data-st="' + s + '" data-obj="' + o.id + '" aria-pressed="' + (st[o.id] === s) + '"' + (locked ? ' disabled' : '') + '>' + ST[s] + '</button>').join('') + '</div></div>').join('');
    let status = '';
    if (ph === 'before' && S.beforeAt) status = '<div class="note green reveal"><strong>État des lieux au départ enregistré à ' + hm(S.beforeAt) + '.</strong> Bonne route vers ' + MOVE.to + ' ! À l’arrivée, refais l’état des lieux.<div class="row" style="margin-top:12px"><button class="btn" type="button" data-phase="after">Nous sommes arrivés : état des lieux à l’arrivée</button></div></div>';
    if (ph === 'after' && S.afterAt) status = compareHTML();
    return '<div class="head"><h1>État des lieux</h1><p>Avant et après le trajet, chaque objet est vérifié et photographié. En cas de casse, la preuve est prête, et l’assurance prend le relais.</p></div>' +
      '<div class="tabs"><button type="button" class="tab' + (ph === 'before' ? ' on' : '') + '" data-phase="before">1. Au départ' + (S.beforeAt ? ' ✓' : '') + '</button><button type="button" class="tab' + (ph === 'after' ? ' on' : '') + '" data-phase="after"' + (S.beforeAt ? '' : ' disabled') + '>2. À l’arrivée' + (S.afterAt ? ' ✓' : '') + '</button></div>' +
      '<div class="card">' + rows +
      (locked ? '' : '<div class="row" style="margin-top:14px"><button class="btn sec" type="button" id="all-ok">Tout est OK</button>' + (ph === 'after' ? '<button class="btn ghost" type="button" id="incident">Simuler un incident</button>' : '') + '<button class="btn" type="button" id="validate"' + (done ? '' : ' disabled') + '>Valider l’état des lieux ' + (ph === 'before' ? 'au départ' : 'à l’arrivée') + '</button></div>') +
      '</div><div style="margin-top:14px" id="insp-status">' + status + '</div>';
  }
  const damages = () => S.objects.filter(o => RANK[S.after[o.id]] > RANK[S.before[o.id]]).map(o => o.name + ' : ' + ST[S.before[o.id]] + ' au départ, ' + ST[S.after[o.id]] + ' à l’arrivée');
  function compareHTML() {
    const d = damages();
    if (!d.length) return '<div class="note green reveal"><strong>Aucun nouveau dommage.</strong> Tout est arrivé à ' + MOVE.to + ' en un seul morceau (départ à ' + hm(S.beforeAt) + ', arrivée ' + arr() + ').<div class="row" style="margin-top:12px"><button class="btn" type="button" data-go="5">Voir le récapitulatif</button></div></div>';
    return '<div class="note red reveal"><strong>Nouveau dommage détecté :</strong> ' + esc(d.join(' ; ')) + '.<div class="card" style="margin-top:12px"><span class="badge b-yellow">Déclaration rédigée par l’IA (simulée)</span><p style="margin-top:8px">Déclaration de casse. Déménagement ' + MOVE.from + ' → ' + MOVE.to + ' du ' + MOVE.date + '. État des lieux au départ à ' + hm(S.beforeAt) + ', à l’arrivée ' + arr() + '. Dommage constaté : ' + esc(d.join(' ; ')) + '. Photos jointes. Montant à évaluer par l’assureur partenaire.</p><p class="small muted" style="margin-top:8px">Envoyée à l’assureur partenaire (démo). Pas de dispute : la preuve est là.</p></div><div class="row" style="margin-top:12px"><button class="btn" type="button" data-go="5">Voir le récapitulatif</button></div></div>';
  }

  function vRecap() {
    const p = picked(), eqTot = p.reduce((a, x) => a + x.price, 0), sell = p.filter(x => x.price > 0), back = sell.reduce((a, x) => a + Math.round(x.price * RESALE), 0), d = damages();
    return '<div class="head"><h1>Récapitulatif et revente</h1><p>Le déménagement est fait. L’équipement, lui, peut resservir : l’IA écrit les annonces pour le revendre à d’autres particuliers.</p></div>' +
      '<div class="grid2"><div class="cards"><div class="card"><h3 style="font-size:17px;margin-bottom:10px">Revendre l’équipement</h3>' +
      (sell.length ? (S.resale ? sell.map(x => '<div class="line reveal" style="display:block"><div class="row between"><strong>' + esc(EQ[x.key]) + '</strong><span class="badge b-green">' + eur(Math.round(x.price * RESALE)) + '</span></div><div class="ai-txt">' + esc(resaleText(x)) + '</div></div>').join('') :
        '<p class="muted small" style="margin-bottom:12px">' + sell.length + ' objet' + (sell.length > 1 ? 's' : '') + ' à revendre : environ ' + eur(back) + ' récupérés.</p><button class="btn" type="button" id="resale">Écrire les annonces de revente</button>') : '<p class="muted small">Rien à revendre : tout l’équipement était gratuit ou déjà à toi.</p>') +
      '</div><div class="note teal"><strong>L’équipement tourne.</strong> La remorque de Marc a servi à ' + esc(kidName()) + ' ; demain, elle servira à une autre famille.</div></div>' +
      '<div class="cards"><div class="card"><div class="lines">' +
      '<div class="line"><span>Équipement d’occasion<br><span class="small muted">' + p.length + ' achat' + (p.length > 1 ? 's' : '') + ' entre particuliers</span></span><strong>' + eur(eqTot) + '</strong></div>' +
      '<div class="line"><span>Pack Protection AMARRE<br><span class="small muted">plans IA, états des lieux, assurance casse</span></span><strong>' + eur(PACK) + '</strong></div>' +
      '<div class="line"><span class="total">Total</span><span class="total">' + eur(eqTot + PACK) + '</span></div>' +
      (sell.length ? '<div class="line"><span>Après revente<br><span class="small muted">coût réel du déménagement protégé</span></span><strong style="color:var(--green)">' + eur(eqTot + PACK - back) + '</strong></div>' : '') +
      '<div class="line"><span>État des lieux</span><strong style="color:' + (d.length ? 'var(--red)' : 'var(--green)') + '">' + (d.length ? 'Dommage déclaré à l’assureur' : 'Aucun dommage') + '</strong></div></div>' +
      (S.confirmed ? '<div class="note green reveal" style="margin-top:14px"><strong>Confirmé (démo).</strong> Aucun paiement réel n’a été effectué.</div>' : '<button class="btn" type="button" id="confirm" style="margin-top:14px;width:100%">Confirmer (démo, sans paiement)</button>') +
      '</div><button class="btn ghost" type="button" id="restart">Recommencer la démo</button></div></div>';
  }

  /* ---------- animation de l'IA ---------- */
  function runAI() {
    animating = true; S.analyzed = true; S.step = 2; render();
    const out = $('#ai-out');
    out.innerHTML = '<div class="typing"><span class="dots"><span></span><span></span><span></span></span> L’IA analyse ' + S.objects.length + ' objets et prépare les plans…</div>';
    setTimeout(() => {
      const tmp = document.createElement('div'); tmp.innerHTML = planHTML();
      const parts = Array.from(tmp.children); out.innerHTML = '';
      let i = 0;
      (function next() {
        if (i < parts.length) { out.appendChild(parts[i++]); setTimeout(next, 300); return; }
        animating = false; const b = $('#to-equip'); if (b) b.disabled = false; renderStepper(); save();
      })();
    }, 1200);
  }

  /* ---------- interactions ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t || t.disabled) return;
    if (t.dataset.go) return go(+t.dataset.go);
    if (t.dataset.del) { S.objects = S.objects.filter(o => o.id !== t.dataset.del); reset(); return render(); }
    if (t.dataset.pick) { const k = t.dataset.pick, i = +t.dataset.i; S.picks[k] = S.picks[k] === i ? null : i; return render(); }
    if (t.dataset.st) { if (!(S.phase === 'before' ? S.beforeAt : S.afterAt)) { S[S.phase][t.dataset.obj] = t.dataset.st; render(); } return; }
    if (t.dataset.phase) { S.phase = t.dataset.phase; return render(); }
    switch (t.id) {
      case 'add': { const cat = $('#new-cat').value; S.objects.push({ id: 'o' + (S.seq++), name: CATS[cat].label.replace(/ \(.*\)/, ''), cat }); reset(); return render(); }
      case 'analyze': return runAI();
      case 'rewrite': if (!animating) { $('#ai-out').innerHTML = planHTML(); } return;
      case 'equip-done': S.equipDone = true; return go(4);
      case 'all-ok': S.objects.forEach(o => { S[S.phase][o.id] = 'ok'; }); return render();
      case 'incident': { S.objects.forEach(o => { if (!S.after[o.id]) S.after[o.id] = S.before[o.id] || 'ok'; }); const tv = S.objects.find(o => o.cat === 'tv') || S.objects[0]; S.after[tv.id] = 'choc'; return render(); }
      case 'validate':
        if (S.phase === 'before') { S.beforeAt = Date.now(); S.after = {}; S.afterAt = null; }
        else S.afterAt = Math.max(Date.now(), S.beforeAt + 26 * 3600000); /* trajet en deux jours, arrivée simulée pour la démo */
        S.confirmed = false; return render();
      case 'resale': S.resale = true; return render();
      case 'confirm': S.confirmed = true; return render();
      case 'restart': S = fresh(); Object.keys(photos).forEach(k => delete photos[k]); return go(1);
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.have) { S.have[t.dataset.have] = t.checked; Object.keys(S.picks).forEach(k => { if (S.have[k]) delete S.picks[k]; }); save(); renderStepper(); return; }
    if (t.dataset && t.dataset.photo && t.files && t.files[0]) {
      const id = t.dataset.photo, rd = new FileReader();
      rd.onload = () => { photos[id] = rd.result; render(); };
      rd.readAsDataURL(t.files[0]);
    }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'child') { S.child = t.value; save(); }
    if (t.id === 'age') { S.age = +t.value; $('#age-v').textContent = S.age + ' ans'; save(); }
  });
  render();
})();
</script>
</body>
</html>
