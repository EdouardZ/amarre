<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMARRE prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2540;--navy2:#123A5C;--teal:#0E7490;--teal-l:#DDF0F3;--orange:#E85D04;--orange-l:#FFE3D0;
  --yellow:#FFC145;--yellow-l:#FFF4DC;--green:#1E9E62;--green-l:#DDF5E8;--red:#C93A3A;--red-l:#FBE3E3;
  --bg:#EEF5F8;--card:#FFFFFF;--text:#0A2540;--muted:#587085;--line:#D3DEE6;--r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk',Inter,sans-serif;margin:0;line-height:1.2}
p{margin:0}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--navy);color:#fff}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0}
.logo{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:22px;letter-spacing:.6px}
.tagline{color:#9FB7C9;font-size:13px}
.demo-pill{margin-left:auto;background:var(--navy2);color:var(--yellow);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}

/* stepper */
.stepper{display:flex;gap:6px;list-style:none;margin:18px 0 0;padding:0;overflow-x:auto}
.stepper li{flex:1 1 0;min-width:96px}
.stepper button{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;border-top:3px solid var(--line);padding:8px 2px 4px;color:var(--muted);font-size:13px;font-weight:600;text-align:left}
.stepper .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--navy);font-size:12px;font-weight:700}
.stepper li.done button{border-top-color:var(--teal);color:var(--teal)}
.stepper li.done .n{background:var(--teal);color:#fff}
.stepper li.cur button{border-top-color:var(--orange);color:var(--navy)}
.stepper li.cur .n{background:var(--orange);color:#fff}
.stepper button:disabled{cursor:not-allowed;opacity:.55}

main{padding:20px 0 48px}
.head{margin-bottom:18px}
.head h1{font-size:28px}
.head p{color:var(--muted);margin-top:6px;max-width:720px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.cards{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.card.dark .muted{color:#9FB7C9}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.b-teal{background:var(--teal-l);color:var(--teal)}
.b-green{background:var(--green-l);color:var(--green)}
.b-orange{background:var(--orange-l);color:#A8430A}
.b-yellow{background:var(--yellow-l);color:#8A5A00}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:11px 20px;font-weight:600;background:var(--orange);color:#fff}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:var(--teal-l);color:var(--teal)}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.kpi{font-family:'Space Grotesk';font-size:26px;font-weight:700}
.note{border-radius:12px;padding:12px 14px;font-size:14px}
.note.teal{background:var(--teal-l)}
.note.yellow{background:var(--yellow-l)}
.note.green{background:var(--green-l)}
.note.red{background:var(--red-l)}

/* regattas */
.reg h3{font-size:19px}
.reg .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:4px 0 12px}

/* families */
.fam{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;color:#fff;background:var(--teal)}
.fam h3{font-size:17px}
.fam .meta{color:var(--muted);font-size:14px}
.fam.sel{outline:2.5px solid var(--orange)}

/* form */
label.f{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--text);background:#fff}
input[type=text]:focus,input[type=range]:focus-visible,button:focus-visible,[role=button]:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--orange)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--orange)}
.field{margin-bottom:16px}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* AI output */
.ai{min-height:320px}
.ai h3{font-size:16px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.ai h3:first-of-type{margin-top:0}
.ai ul{margin:0;padding-left:20px}
.ai li{margin:4px 0}
.ai .kid{background:var(--yellow-l);border-radius:12px;padding:12px 14px;font-size:15px}
.ai .kid ol{margin:8px 0 0;padding-left:20px}
.typing{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--teal);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.reveal{animation:r .35s ease both}
@keyframes r{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal,.dots span{animation:none}}

/* inspection */
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.tab.on{border-color:var(--teal);background:var(--teal);color:#fff}
.tab:disabled{opacity:.45;cursor:not-allowed}
.insp{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
svg.boat{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
svg.boat [role=button]{cursor:pointer}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.zone{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;font-weight:600;font-size:14px;text-align:left;color:var(--text)}
.zone .st{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;background:#E3EAF0;color:var(--muted);white-space:nowrap}
.zone.ok .st{background:var(--green-l);color:var(--green)}
.zone.rayure .st{background:var(--yellow-l);color:#8A5A00}
.zone.choc .st{background:var(--red-l);color:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* recap */
.lines{display:grid;gap:10px}
.line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:10px}
.line:last-child{border-bottom:0;padding-bottom:0}
.total{font-family:'Space Grotesk';font-size:22px;font-weight:700}
.ok-ico{color:var(--green);font-weight:700}

footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 28px}

@media (max-width:820px){
  .grid2,.insp{grid-template-columns:1fr}
  .head h1{font-size:24px}
  .fam{grid-template-columns:auto 1fr}
  .fam .act{grid-column:1/-1}
  .fam .act .btn{width:100%}
  .stepper .lbl{display:none}
  .stepper li{min-width:44px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-in">
      <div class="logo">
        <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#123A5C" stroke="#FFC145" stroke-width="3"/><rect x="15" y="8" width="2" height="17" fill="#D7E3EC"/><path d="M17.5 9 L29 8 L27.5 22 L17.5 23 Z" fill="#FFC145"/><path d="M9 25 H31 L28 31 H12 Z" fill="#fff"/></svg>
        AMARRE
      </div>
      <span class="tagline">Le bateau de ton enfant voyage protégé.</span>
      <span class="demo-pill">Démo · données fictives</span>
    </div>
  </div>
</header>

<div class="wrap">
  <ol class="stepper" id="stepper" aria-label="Étapes"></ol>
  <main id="main"></main>
</div>
<footer>Prototype AMARRE · équipe CodeBreakers · Familles, clubs et trajets fictifs. L’IA est simulée dans cette démo ; aucun paiement réel.</footer>

<script>
(function () {
  'use strict';

  /* ---------- données fictives ---------- */
  const CLUB = 'Club de voile de Brest';
  const REGATTAS = [
    { id: 'lr', name: 'Régate de ligue', place: 'La Rochelle', date: 'samedi 14 mars', km: 400, boats: 14, found: 11 },
    { id: 'lo', name: 'Coupe d’hiver', place: 'Lorient', date: 'dimanche 22 mars', km: 135, boats: 9, found: 9 },
    { id: 'qb', name: 'Stage de printemps', place: 'Quiberon', date: 'du 6 au 10 avril', km: 180, boats: 12, found: 7 }
  ];
  const FAMILIES = {
    lr: [
      { id: 'martin', name: 'Famille Martin', ini: 'M', color: '#0E7490', transport: 'remorque', label: 'Remorque pour 3 Optimist', free: 1, depart: 'samedi, 6 h 30, parking du club', trips: 12 },
      { id: 'legall', name: 'Famille Le Gall', ini: 'LG', color: '#E85D04', transport: 'barres', label: 'Barres de toit', free: 1, depart: 'vendredi, 18 h, parking du club', trips: 4 },
      { id: 'diallo', name: 'Famille Diallo', ini: 'D', color: '#1E9E62', transport: 'remorque', label: 'Remorque pour 4 Optimist', free: 3, depart: 'samedi, 5 h 45, parking du club', trips: 0 }
    ],
    lo: [
      { id: 'kerjean', name: 'Famille Kerjean', ini: 'K', color: '#0E7490', transport: 'remorque', label: 'Remorque pour 3 Optimist', free: 2, depart: 'dimanche, 7 h, parking du club', trips: 7 },
      { id: 'moreau', name: 'Famille Moreau', ini: 'Mo', color: '#E85D04', transport: 'barres', label: 'Barres de toit', free: 1, depart: 'samedi, 17 h, parking du club', trips: 2 }
    ],
    qb: [
      { id: 'benali', name: 'Famille Benali', ini: 'B', color: '#1E9E62', transport: 'remorque', label: 'Remorque pour 4 Optimist', free: 2, depart: 'lundi 6 avril, 8 h, parking du club', trips: 9 }
    ]
  };
  const ZONES = [
    { id: 'avant', label: 'Coque avant' }, { id: 'arriere', label: 'Coque arrière' }, { id: 'mat', label: 'Mât' },
    { id: 'derive', label: 'Dérive' }, { id: 'safran', label: 'Safran' }, { id: 'espars', label: 'Bôme et livarde' }, { id: 'voile', label: 'Voile' }
  ];
  const ST_LABEL = { ok: 'OK', rayure: 'Rayure', choc: 'Choc' };
  const ST_NEXT = { undefined: 'ok', ok: 'rayure', rayure: 'choc', choc: 'ok' };
  const ST_RANK = { ok: 0, rayure: 1, choc: 2 };
  const ST_FILL = { none: '#E3EAF0', ok: '#BFEBD3', rayure: '#FFE7A8', choc: '#F7B8B8' };
  const FEE = 8, PER_KM = 0.05;
  const STEPS = ['Régate', 'Place', 'Protection IA', 'État des lieux', 'Récapitulatif'];

  /* ---------- état ---------- */
  const KEY = 'amarre-demo';
  const fresh = () => ({ step: 1, regatta: null, family: null, child: 'Léo', age: 10, wind: false, plan: false, before: {}, after: {}, beforeAt: null, afterAt: null, phase: 'before', confirmed: false });
  let S = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) { /* stockage indisponible */ }
  const photos = { plan: null, before: null, after: null };
  let animating = false;
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } };

  const $ = (sel, el) => (el || document).querySelector(sel);
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reg = () => REGATTAS.find(r => r.id === S.regatta);
  const fam = () => (FAMILIES[S.regatta] || []).find(f => f.id === S.family);
  const share = r => Math.round(r.km * PER_KM);
  const childName = () => (S.child || '').trim() || 'ton enfant';
  const famLow = f => f.name.replace(/^Famille/, 'famille');
  const lowFirst = t => t.charAt(0).toLowerCase() + t.slice(1);
  const hm = ts => { const d = new Date(ts); return d.getHours() + ' h ' + String(d.getMinutes()).padStart(2, '0'); };
  const maxStep = () => !S.regatta ? 1 : !S.family ? 2 : !S.plan ? 3 : !(S.beforeAt && S.afterAt) ? 4 : 5;

  /* ---------- « IA » : rédaction du plan (simulée pour la démo) ---------- */
  function generatePlan() {
    const r = reg(), f = fam(), n = childName(), young = S.age <= 11;
    const load = f.transport === 'remorque' ? [
      'Coque posée sur les supports de la remorque, bien centrée, avec une mousse à chaque point d’appui.',
      'Deux sangles croisées sur la coque, serrées sans excès : la coque d’un Optimist peut se déformer.',
      'Mât, bôme et livarde dans leur housse, entourés de mousse, attachés le long de la remorque en trois points.',
      'Safran et dérive dans leurs housses matelassées, rangés dans la voiture de la ' + famLow(f) + ', pas sur la remorque.',
      'Voile roulée, jamais pliée, dans son sac.'
    ] : [
      'Coque retournée sur les barres de toit, une mousse sur chaque barre.',
      'Deux sangles plates par-dessus la coque, autour des barres, bien serrées.',
      'Une corde de sécurité à l’avant et une à l’arrière, attachées aux points d’accroche de la voiture.',
      'Mât, bôme et livarde dans leur housse, dans la voiture si la place le permet.',
      'Safran, dérive et voile roulée dans le coffre, chacun dans sa housse.'
    ];
    load.push(r.km > 250 ? 'Trajet de ' + r.km + ' km : une pause toutes les 2 heures pour vérifier les sangles.' : 'Trajet de ' + r.km + ' km : vérifier les sangles au départ et à l’arrivée.');
    if (S.wind) load.push('Vent fort annoncé sur la route : ajouter une troisième sangle à l’arrière de la coque.');
    const kid = young ? {
      intro: 'Capitaine ' + n + ' ! Ton Optimist part en voyage avec la ' + famLow(f) + ' jusqu’à ' + r.place + '. Avant le départ, ta mission en 3 étapes :',
      steps: ['Range ton safran et ta dérive dans leurs housses, comme des trésors.', 'Roule ta voile bien serrée, sans la plier.', 'Fais un nœud de cabestan pour attacher ta bosse à la remorque : un adulte vérifiera !'],
      end: 'Bravo, ton bateau est protégé. Rendez-vous à ' + r.place + ' !'
    } : {
      intro: n + ', tu es responsable de ton bateau pour ce trajet de ' + r.km + ' km. Ta check-list :',
      steps: ['Safran et dérive : housses fermées, rangés dans la voiture.', 'Voile roulée avec ses lattes, sac fermé.', 'Bosse d’avant : nœud de cabestan sur la remorque, puis deux demi-clés.', 'Une photo de chaque face de la coque pour l’état des lieux.'],
      end: 'Ton bateau est entre de bonnes mains : les tiennes.'
    };
    const watch = ['Photographier la coque dessus et dessous, le pied de mât, le safran et la dérive.', 'Noter les rayures déjà présentes : elles ne seront pas comptées à l’arrivée.'];
    return { load, kid, watch };
  }
  function planHTML(p) {
    return '<h3>Plan de chargement</h3><ul>' + p.load.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>' +
      '<h3>Mission de ' + esc(childName()) + '</h3><div class="kid"><p>' + esc(p.kid.intro) + '</p><ol>' + p.kid.steps.map(t => '<li>' + esc(t) + '</li>').join('') + '</ol><p style="margin-top:8px;font-weight:600">' + esc(p.kid.end) + '</p></div>' +
      '<h3>Pour l’état des lieux</h3><ul>' + p.watch.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul>';
  }

  /* ---------- rendu ---------- */
  function renderStepper() {
    const m = maxStep();
    $('#stepper').innerHTML = STEPS.map((l, i) => {
      const n = i + 1, cls = n === S.step ? 'cur' : n < m || (n === m && n < S.step) ? 'done' : '';
      return '<li class="' + cls + '"><button type="button" data-go="' + n + '"' + (n > m ? ' disabled' : '') + ' aria-label="Étape ' + n + ' : ' + l + '"' + (n === S.step ? ' aria-current="step"' : '') + '><span class="n">' + n + '</span><span class="lbl">' + l + '</span></button></li>';
    }).join('');
  }

  function render() {
    if (S.step > maxStep()) S.step = maxStep();
    renderStepper();
    const views = [null, vRegattas, vFamilies, vProtect, vInspect, vRecap];
    $('#main').innerHTML = views[S.step]();
    if (S.step === 3 && S.plan && !animating) $('#ai-out').innerHTML = planHTML(generatePlan());
    if (S.step === 3) syncPhoto('plan');
    if (S.step === 4) syncPhoto(S.phase);
    save();
  }
  function go(n) { S.step = n; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  function vRegattas() {
    const list = REGATTAS.map(r => {
      const pct = Math.round(r.found / r.boats * 100), missing = r.boats - r.found;
      return '<div class="card reg"><div class="row between"><h3>' + esc(r.name) + ' · ' + esc(r.place) + '</h3>' +
        (missing ? '<span class="badge b-orange">' + missing + ' bateau' + (missing > 1 ? 'x' : '') + ' sans place</span>' : '<span class="badge b-green">Tous les bateaux ont une place</span>') + '</div>' +
        '<div class="meta"><span>' + esc(r.date) + '</span><span>' + r.km + ' km depuis Brest</span><span>' + r.boats + ' bateaux du club inscrits</span></div>' +
        '<div class="row between small muted" style="margin-bottom:6px"><span>Places trouvées</span><span>' + r.found + ' / ' + r.boats + '</span></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
        '<div class="row" style="margin-top:14px"><button class="btn" type="button" data-reg="' + r.id + '">Trouver une place pour l’Optimist de ' + esc(childName()) + '</button></div></div>';
    }).join('');
    const tot = REGATTAS.reduce((a, r) => ({ b: a.b + r.boats, f: a.f + r.found }), { b: 0, f: 0 });
    return '<div class="head"><h1>Prochaines régates du club</h1><p>' + CLUB + ' (fictif). Choisis une régate : AMARRE trouve une famille du club qui emmène le bateau, et l’IA écrit le plan pour le protéger.</p></div>' +
      '<div class="grid2"><div class="cards">' + list + '</div>' +
      '<div class="cards"><div class="card dark"><p class="small muted">Côté club</p><h2 style="font-size:20px;margin:4px 0 14px">Le tableau de bord du club</h2>' +
      '<div class="row" style="gap:22px"><div><div class="kpi">' + tot.b + '</div><div class="small muted">bateaux à emmener</div></div><div><div class="kpi" style="color:#FFC145">' + tot.f + '</div><div class="small muted">places trouvées</div></div><div><div class="kpi">' + (tot.b - tot.f) + '</div><div class="small muted">à trouver</div></div></div>' +
      '<p class="small muted" style="margin-top:14px">AMARRE relance les familles qui ont de la place. Abonnement club : 290 € par an.</p></div>' +
      '<div class="note teal"><strong>Protection de l’enfant.</strong> ' + esc(childName()) + ' n’a pas de compte. Seuls ses parents, vérifiés par le club, échangent avec les autres familles.</div></div></div>';
  }

  function vFamilies() {
    const r = reg(), list = FAMILIES[r.id].map(f => {
      const sel = f.id === S.family;
      return '<div class="card fam' + (sel ? ' sel' : '') + '"><div class="avatar" style="background:' + f.color + '" aria-hidden="true">' + f.ini + '</div>' +
        '<div><div class="row"><h3>' + esc(f.name) + '</h3><span class="badge b-teal">✓ Vérifiée par le club</span></div>' +
        '<div class="meta">' + esc(f.label) + ' · ' + f.free + ' place' + (f.free > 1 ? 's' : '') + ' libre' + (f.free > 1 ? 's' : '') + '</div>' +
        '<div class="meta">Départ : ' + esc(f.depart) + '</div>' +
        '<div class="small" style="margin-top:4px">' + (f.trips ? '<span class="badge b-green">' + f.trips + ' trajets AMARRE, aucune casse</span>' : '<span class="badge b-yellow">Nouvelle sur AMARRE</span>') + '</div></div>' +
        '<div class="act"><button class="btn' + (sel ? ' sec' : '') + '" type="button" data-fam="' + f.id + '">' + (sel ? 'Place choisie ✓' : 'Choisir cette place') + '</button></div></div>';
    }).join('');
    return '<div class="head"><h1>' + esc(r.name) + ' · ' + esc(r.place) + '</h1><p>' + esc(r.date) + ' · ' + r.km + ' km. Ces familles du club ont de la place pour l’Optimist de ' + esc(childName()) + '.</p></div>' +
      '<div class="grid2"><div class="cards">' + list + '</div><div class="cards">' +
      '<div class="card"><h3 style="font-size:17px;margin-bottom:10px">Combien ça coûte ?</h3><div class="lines">' +
      '<div class="line"><span>Participation aux frais de route<br><span class="small muted">' + r.km + ' km × 0,05 €, versée à la famille qui transporte</span></span><strong>' + share(r) + ' €</strong></div>' +
      '<div class="line"><span>Frais de service AMARRE<br><span class="small muted">plan de protection IA, état des lieux, assurance casse</span></span><strong>' + FEE + ' €</strong></div></div>' +
      '<p class="small muted" style="margin-top:10px">Le transport reste un partage de frais entre particuliers, comme le prévoit la loi pour le cotransportage.</p></div>' +
      '<div class="note teal"><strong>Aucun contact entre un adulte et un enfant.</strong> La messagerie est réservée aux parents. ' + esc(childName()) + ' voyage avec sa propre famille ; seul son bateau part avec une autre.</div></div></div>';
  }

  function vProtect() {
    const f = fam(), r = reg();
    return '<div class="head"><h1>L’IA protège le bateau</h1><p>Le parent prend l’Optimist en photo, et l’IA rédige le plan de chargement adapté au trajet (' + esc(lowFirst(f.label)) + ', ' + r.km + ' km), plus une mission pour l’enfant, adaptée à son âge.</p></div>' +
      '<div class="grid2"><div class="card">' +
      '<div class="field"><label class="f" for="child">Prénom de l’enfant</label><input type="text" id="child" maxlength="20" value="' + esc(S.child) + '" autocomplete="off"></div>' +
      '<div class="field"><label class="f" for="age">Âge : <span id="age-v">' + S.age + ' ans</span></label><input type="range" id="age" min="8" max="16" value="' + S.age + '"><div class="row between small muted"><span>8 ans : mission ludique</span><span>16 ans : check-list technique</span></div></div>' +
      '<div class="field"><label class="check"><input type="checkbox" id="wind"' + (S.wind ? ' checked' : '') + '> Vent fort annoncé sur la route</label></div>' +
      '<div class="field"><span class="f">Photo du bateau (facultatif)</span><div class="photo"><img id="ph-plan" alt="Photo du bateau" hidden><span class="btn ghost file-btn">Prendre une photo<input type="file" accept="image/*" capture="environment" data-photo="plan" aria-label="Prendre une photo du bateau"></span></div><p class="small muted" style="margin-top:6px">La photo reste sur ton appareil (démo).</p></div>' +
      '<button class="btn" type="button" id="gen">' + (S.plan ? 'Réécrire le plan' : 'Générer le plan de protection') + '</button></div>' +
      '<div class="card ai"><div class="row between" style="margin-bottom:12px"><span class="badge b-yellow">Écrit par l’IA (simulée pour la démo)</span></div><div id="ai-out">' +
      (S.plan ? '' : '<p class="muted">Le plan apparaîtra ici. Change l’âge ou la météo, puis réécris-le : l’IA s’adapte.</p>') + '</div>' +
      '<div class="row" style="margin-top:16px"><button class="btn" type="button" data-go="4"' + (S.plan ? '' : ' disabled') + ' id="to-insp">Passer à l’état des lieux</button></div></div></div>';
  }

  function boatSVG(st) {
    const fill = id => ST_FILL[st[id] || 'none'];
    const z = (id, shape) => '<g role="button" tabindex="0" data-zone="' + id + '" aria-label="' + ZONES.find(q => q.id === id).label + ' : ' + (st[id] ? ST_LABEL[st[id]] : 'non vérifié') + '">' + shape + '</g>';
    const hull = 'M70 20 L130 20 Q164 60 164 140 L160 250 Q158 272 138 274 L62 274 Q42 272 40 250 L36 140 Q36 60 70 20 Z';
    return '<svg class="boat" viewBox="0 0 200 330" aria-label="Optimist vu de dessus"><defs><clipPath id="hc"><path d="' + hull + '"/></clipPath></defs>' +
      z('avant', '<rect x="0" y="0" width="200" height="140" fill="' + fill('avant') + '" clip-path="url(#hc)"/>') +
      z('arriere', '<rect x="0" y="140" width="200" height="140" fill="' + fill('arriere') + '" clip-path="url(#hc)"/>') +
      '<path d="' + hull + '" fill="none" stroke="#0A2540" stroke-width="3"/>' +
      '<line x1="38" y1="140" x2="162" y2="140" stroke="#0A2540" stroke-width="1" stroke-dasharray="4 4" opacity=".4"/>' +
      z('derive', '<rect x="91" y="150" width="18" height="46" rx="4" fill="' + fill('derive') + '" stroke="#0A2540" stroke-width="2"/>') +
      z('mat', '<circle cx="100" cy="78" r="11" fill="' + fill('mat') + '" stroke="#0A2540" stroke-width="2"/>') +
      z('safran', '<rect x="93" y="272" width="14" height="46" rx="4" fill="' + fill('safran') + '" stroke="#0A2540" stroke-width="2"/>') +
      '<text x="100" y="58" text-anchor="middle" font-size="11" fill="#587085">avant</text></svg>';
  }

  function vInspect() {
    const f = fam(), r = reg(), ph = S.phase, st = S[ph], done = ZONES.every(q => st[q.id]);
    const locked = ph === 'before' ? !!S.beforeAt : !!S.afterAt;
    const zones = ZONES.map(q => '<button type="button" class="zone ' + (st[q.id] || '') + '" data-zone="' + q.id + '"' + (locked ? ' disabled' : '') + '><span>' + q.label + '</span><span class="st">' + (st[q.id] ? ST_LABEL[st[q.id]] : 'À vérifier') + '</span></button>').join('');
    let status = '';
    if (ph === 'before' && S.beforeAt) status = '<div class="note green reveal"><strong>État des lieux au départ enregistré à ' + hm(S.beforeAt) + '.</strong> Le bateau est en route avec la ' + esc(famLow(f)) + '. À l’arrivée à ' + esc(r.place) + ', refais l’état des lieux.<div class="row" style="margin-top:12px"><button class="btn" type="button" data-phase="after">Le bateau est arrivé : état des lieux à l’arrivée</button></div></div>';
    if (ph === 'after' && S.afterAt) status = compareHTML();
    return '<div class="head"><h1>État des lieux</h1><p>Avant et après le trajet, chaque partie du bateau est vérifiée et photographiée. En cas de casse, la preuve est prête.</p></div>' +
      '<div class="tabs" role="tablist"><button type="button" class="tab' + (ph === 'before' ? ' on' : '') + '" data-phase="before" role="tab" aria-selected="' + (ph === 'before') + '">1. Au départ' + (S.beforeAt ? ' ✓' : '') + '</button>' +
      '<button type="button" class="tab' + (ph === 'after' ? ' on' : '') + '" data-phase="after" role="tab" aria-selected="' + (ph === 'after') + '"' + (S.beforeAt ? '' : ' disabled') + '>2. À l’arrivée' + (S.afterAt ? ' ✓' : '') + '</button></div>' +
      '<div class="card"><div class="insp"><div>' + boatSVG(st) + '</div><div>' +
      '<p class="small muted" style="margin-bottom:10px">Touche une partie du bateau pour changer son état : OK, rayure ou choc.</p>' +
      '<div class="zones">' + zones + '</div>' +
      '<div class="legend"><span><i style="background:' + ST_FILL.none + '"></i>À vérifier</span><span><i style="background:' + ST_FILL.ok + '"></i>OK</span><span><i style="background:' + ST_FILL.rayure + '"></i>Rayure</span><span><i style="background:' + ST_FILL.choc + '"></i>Choc</span></div>' +
      '<div class="photo" style="margin:6px 0 14px"><img id="ph-' + ph + '" alt="Photo de l’état des lieux" hidden><span class="btn ghost file-btn">Ajouter une photo<input type="file" accept="image/*" capture="environment" data-photo="' + ph + '" aria-label="Ajouter une photo pour l’état des lieux"' + (locked ? ' disabled' : '') + '></span></div>' +
      (locked ? '' : '<div class="row"><button class="btn sec" type="button" id="all-ok">Tout est OK</button>' + (ph === 'after' ? '<button class="btn ghost" type="button" id="incident">Simuler un incident</button>' : '') +
        '<button class="btn" type="button" id="validate"' + (done ? '' : ' disabled') + '>Valider l’état des lieux ' + (ph === 'before' ? 'au départ' : 'à l’arrivée') + '</button></div>') +
      '</div></div></div><div style="margin-top:14px" id="insp-status">' + status + '</div>';
  }

  function damages() {
    return ZONES.filter(q => ST_RANK[S.after[q.id]] > ST_RANK[S.before[q.id]]).map(q => ({ label: q.label, from: ST_LABEL[S.before[q.id]], to: ST_LABEL[S.after[q.id]] }));
  }
  function compareHTML() {
    const d = damages(), f = fam(), r = reg();
    if (!d.length) return '<div class="note green reveal"><strong>Aucun nouveau dommage.</strong> L’Optimist de ' + esc(childName()) + ' est arrivé à ' + esc(r.place) + ' en un seul morceau (départ ' + hm(S.beforeAt) + ', arrivée ' + hm(S.afterAt) + ').<div class="row" style="margin-top:12px"><button class="btn" type="button" data-go="5">Voir le récapitulatif</button></div></div>';
    const list = d.map(x => x.label + ' : ' + x.from + ' au départ, ' + x.to + ' à l’arrivée').join(' ; ');
    return '<div class="note red reveal"><strong>Nouveau dommage détecté :</strong> ' + esc(list) + '.' +
      '<div class="card" style="margin-top:12px"><span class="badge b-yellow">Déclaration rédigée par l’IA (simulée)</span><p style="margin-top:8px">Déclaration de casse. Trajet Brest → ' + esc(r.place) + ' (' + r.km + ' km), bateau transporté par la ' + esc(famLow(f)) + '. État des lieux au départ à ' + hm(S.beforeAt) + ', à l’arrivée à ' + hm(S.afterAt) + '. Dommage constaté : ' + esc(list) + '. Photos jointes. Montant à évaluer par l’assureur partenaire.</p>' +
      '<p class="small muted" style="margin-top:8px">Envoyée à l’assureur partenaire (démo). Les deux familles reçoivent une copie : pas de dispute, la preuve est là.</p></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn" type="button" data-go="5">Voir le récapitulatif</button></div></div>';
  }

  function vRecap() {
    const r = reg(), f = fam(), d = damages(), sh = share(r);
    return '<div class="head"><h1>Récapitulatif du trajet</h1><p>Tout ce qui protège l’Optimist de ' + esc(childName()) + ', au même endroit.</p></div>' +
      '<div class="grid2"><div class="card"><div class="lines">' +
      '<div class="line"><span>Régate</span><strong>' + esc(r.name) + ' · ' + esc(r.place) + '</strong></div>' +
      '<div class="line"><span>Famille qui transporte</span><strong>' + esc(f.name) + ' <span class="ok-ico">✓</span></strong></div>' +
      '<div class="line"><span>Plan de protection IA</span><strong class="ok-ico">Rédigé ✓</strong></div>' +
      '<div class="line"><span>État des lieux</span><strong>Départ ' + hm(S.beforeAt) + ' · arrivée ' + hm(S.afterAt) + '</strong></div>' +
      '<div class="line"><span>Résultat</span><strong style="color:' + (d.length ? 'var(--red)' : 'var(--green)') + '">' + (d.length ? 'Dommage déclaré à l’assureur' : 'Aucun dommage') + '</strong></div></div></div>' +
      '<div class="cards"><div class="card"><div class="lines">' +
      '<div class="line"><span>Participation aux frais<br><span class="small muted">versée à la ' + esc(famLow(f)) + '</span></span><strong>' + sh + ' €</strong></div>' +
      '<div class="line"><span>Frais de service AMARRE<br><span class="small muted">IA, état des lieux, assurance casse</span></span><strong>' + FEE + ' €</strong></div>' +
      '<div class="line"><span class="total">Total</span><span class="total">' + (sh + FEE) + ' €</span></div></div>' +
      (S.confirmed ? '<div class="note green reveal" style="margin-top:14px"><strong>Réservation confirmée (démo).</strong> Aucun paiement réel n’a été effectué.</div>' : '<button class="btn" type="button" id="confirm" style="margin-top:14px;width:100%">Confirmer la réservation (démo, sans paiement)</button>') +
      '</div><div class="note teal"><strong>Protection de l’enfant.</strong> ' + esc(childName()) + ' n’a pas de compte et ne parle à aucun adulte via AMARRE. Ses parents gardent la main sur tout.</div>' +
      '<button class="btn ghost" type="button" id="reset">Recommencer la démo</button></div></div>';
  }

  /* ---------- photos (restent en mémoire, jamais envoyées) ---------- */
  function syncPhoto(k) { const img = $('#ph-' + k); if (img && photos[k]) { img.src = photos[k]; img.hidden = false; } }

  /* ---------- interactions ---------- */
  function cycleZone(id) {
    const st = S[S.phase];
    if ((S.phase === 'before' && S.beforeAt) || (S.phase === 'after' && S.afterAt)) return;
    st[id] = ST_NEXT[st[id]];
    render();
    const el = document.querySelector('.zone[data-zone="' + id + '"]'); if (el) el.focus();
  }
  function runGeneration() {
    animating = true;
    const out = $('#ai-out'), btn = $('#gen'), next = $('#to-insp');
    btn.disabled = true; next.disabled = true;
    out.innerHTML = '<div class="typing"><span class="dots"><span></span><span></span><span></span></span> L’IA analyse le trajet et rédige le plan…</div>';
    const p = generatePlan();
    setTimeout(() => {
      out.innerHTML = '';
      const tmp = document.createElement('div'); tmp.innerHTML = planHTML(p);
      const parts = Array.from(tmp.children);
      let i = 0;
      (function step() {
        if (i < parts.length) { parts[i].classList.add('reveal'); out.appendChild(parts[i]); i++; setTimeout(step, 260); return; }
        animating = false; S.plan = true; save(); btn.disabled = false; btn.textContent = 'Réécrire le plan'; next.disabled = false; renderStepper();
      })();
    }, 1100);
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('button,[data-zone]');
    if (!t || t.disabled) return;
    if (t.dataset.go) return go(+t.dataset.go);
    if (t.dataset.reg) { if (S.regatta !== t.dataset.reg) { S.family = null; S.plan = false; S.before = {}; S.after = {}; S.beforeAt = S.afterAt = null; S.phase = 'before'; S.confirmed = false; } S.regatta = t.dataset.reg; return go(2); }
    if (t.dataset.fam) { if (S.family !== t.dataset.fam) { S.plan = false; S.before = {}; S.after = {}; S.beforeAt = S.afterAt = null; S.phase = 'before'; S.confirmed = false; } S.family = t.dataset.fam; return go(3); }
    if (t.dataset.zone) return cycleZone(t.dataset.zone);
    if (t.dataset.phase) { S.phase = t.dataset.phase; return render(); }
    switch (t.id) {
      case 'gen': return runGeneration();
      case 'all-ok': ZONES.forEach(q => { S[S.phase][q.id] = 'ok'; }); return render();
      case 'incident': ZONES.forEach(q => { if (!S.after[q.id]) S.after[q.id] = S.before[q.id] || 'ok'; }); S.after.safran = 'choc'; return render();
      case 'validate':
        if (S.phase === 'before') { S.beforeAt = Date.now(); S.after = {}; S.afterAt = null; }
        else { S.afterAt = Math.max(Date.now(), S.beforeAt + Math.round(reg().km / 80 * 3600000)); /* heure d'arrivée simulée pour la démo */ }
        S.confirmed = false; return render();
      case 'confirm': S.confirmed = true; return render();
      case 'reset': S = fresh(); Object.keys(photos).forEach(k => { photos[k] = null; }); return go(1);
    }
  });
  document.addEventListener('keydown', e => {
    const z = e.target.closest && e.target.closest('g[data-zone]');
    if (z && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); cycleZone(z.dataset.zone); }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'child') { S.child = t.value; save(); }
    if (t.id === 'age') { S.age = +t.value; $('#age-v').textContent = S.age + ' ans'; save(); }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'wind') { S.wind = t.checked; save(); }
    if (t.dataset && t.dataset.photo && t.files && t.files[0]) {
      const k = t.dataset.photo, rd = new FileReader();
      rd.onload = () => { photos[k] = rd.result; syncPhoto(k); };
      rd.readAsDataURL(t.files[0]);
    }
  });

  render();
})();
</script>
</body>
</html>
